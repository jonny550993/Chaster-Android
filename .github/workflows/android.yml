name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaster-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest debug APK to Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          target_commitish: ${{ github.sha }}
          name: Latest Chaster Android Debug Build
          body: |
            Automatically updated debug build from the `main` branch.

            This is a test build, not a production release. The successful build confirms the APK compiles; Chaster API sign-in and runtime behavior may still need testing.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
