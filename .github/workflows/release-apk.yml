name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.1)"
        required: true
        default: "0.1.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Chaster-${{ github.event.inputs.version || github.ref_name }}.apk"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "$VERSION" != v* ]]; then VERSION="v$VERSION"; fi
          gh release create "$VERSION" release/*.apk --repo "${{ github.repository }}" --title "Chaster $VERSION" --generate-notes
